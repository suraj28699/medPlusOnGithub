<div style="display: flex; justify-content: center; align-items: center;">
    <!-- login form start -->
    <div style="border: 1px solid green;width: 500px;height: 500px; background-color: rgb(129, 214, 214);">
        <div style="display: flex;justify-content: center;align-items: center;align-items: center; height: 100%">
            <form name="loginForm" #frm=ngForm (ngSubmit)="Onsubmit(frm)" style="width: 250px;">
                <div class="form-group" style="">
                    <label for="userName">User ID: </label>
                    <input type="email" name="eml" class="form-control" #eml="ngModel" ngModel>
                </div>
                <div class="form-group">
                    <label for="pass">Password:</label>
                    <input type="password" name="pass" class="form-control" #pass="ngModel" ngModel>
                </div>
                <div class="form-group" style="text-align: center;">
                    <button type="submit" style="margin-top: 10px;" class="btn btn-outline-success">Login</button>
                    <button class="btn btn-outline-primary" (click)="signOut()">Singn out</button>
                </div>
            </form>
        </div>
    </div>
    <!-- login form end -->

</div>
